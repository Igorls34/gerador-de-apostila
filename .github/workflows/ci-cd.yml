name: CI/CD - Gerador de Apostilas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: Testes e Validação (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 pillow flask pytest

      - name: Executar testes automatizados
        run: pytest -v

  deploy:
    name: Deploy no Servidor (homesrv)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [ self-hosted, gerador-de-apostila ]

    steps:
      - name: Executar script de deploy no servidor
        run: bash /home/igordev/apps/gerador-de-apostila/deploy/deploy.sh
